  #fireworks{
    position:fixed;inset:0;
    z-index:1;
    pointer-events:none;
  }
  .container{
    position:relative;
    z-index:2;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    padding:20px 16px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    text-align:center;
  }

  .clock{
    width:200px;
    height:200px;
    border:6px solid rgba(255,255,255,0.2);
    border-radius:50%;
    margin:0 auto;
    position:relative;
    background:radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.0) 70%);
    box-shadow:0 0 35px #ff80e7, inset 0 0 25px #7df9ff;
    overflow:hidden;
  }

  .hand{
    position:absolute;
    top:50%;
    left:50%;
    transform-origin:50% 100%;
    transform:translate(-50%,-100%) rotate(0deg);
    border-radius:3px;
  }
  .hand.hour{
    width:6px;
    height:55px;
    background:#ff66c4;
    box-shadow:0 0 10px #ff66c4;
  }
  .hand.minute{
    width:4px;
    height:75px;
    background:#80eaff;
    box-shadow:0 0 10px #80eaff;
  }
  .hand.second{
    width:2px;
    height:85px;
    background:#f8ff80;
    box-shadow:0 0 8px #f8ff80;
  }
  .center-dot{
    position:absolute;
    top:50%;
    left:50%;
    width:12px;
    height:12px;
    background:#fff;
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 10px #fff;
  }

  h1{
    color:#ffb3ef;
    text-shadow:
      0 2px 10px rgba(255,130,200,0.5),
      0 0 20px rgba(255,105,180,0.4),
      0 0 40px rgba(255,80,160,0.25),
      0 0 60px rgba(255,60,140,0.15);
    margin:0 0 12px 0;
    font-size:clamp(34px,7.5vw,58px);
    font-weight:400;
    letter-spacing:1.5px;
    text-transform:none;
    max-width:95vw;
    word-wrap:break-word;
  }

  .timer{
    display:grid;
    grid-template-columns:repeat(2,minmax(130px,1fr));
    gap:14px;
    width:min(90vw,420px);
  }
  .tile{
    background:rgba(0,0,0,0.45);
    padding:18px 16px;
    border-radius:14px;
    backdrop-filter:blur(4px);
    box-shadow:0 0 18px rgba(255,128,231,.2);
  }
  .tile span{
    display:block;
    font-size:clamp(34px,7vw,50px);
    font-weight:400;
    line-height:1;
    letter-spacing:1.2px;
    text-shadow:
      0 2px 8px rgba(255,140,200,0.45),
      0 0 16px rgba(255,100,180,0.3);
  }
  .tile small{
    display:block;
    margin-top:6px;
    color:#ffc8dd;
    font-size:clamp(12px,2.8vw,14px);
    letter-spacing:0.8px;
    text-shadow: 0 1px 5px rgba(255,150,200,0.35);
  }

  /* Carta final */
  #finalCard{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.55);
    opacity:0;
    pointer-events:none;
    transition:opacity 1.2s ease;
    padding:20px;
  }
  #finalCard.show{
    opacity:1;
    pointer-events:auto;
  }
  .card-inner{
    background:linear-gradient(145deg, rgba(40,10,50,0.95), rgba(20,5,30,0.98));
    border:2px solid rgba(255,150,200,0.4);
    border-radius:24px;
    padding:32px 28px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 0 40px rgba(255,100,180,0.35), 0 20px 60px rgba(0,0,0,0.5);
    transform:scale(0.85) translateY(20px);
    transition:transform 1s cubic-bezier(0.34,1.56,0.64,1);
  }
  #finalCard.show .card-inner{
    transform:scale(1) translateY(0);
  }
  .card-inner h2{
    color:#ffb3ef;
    font-size:clamp(26px,6vw,34px);
    margin:0 0 16px;
    letter-spacing:1px;
    text-shadow:0 0 20px rgba(255,120,200,0.5);
  }
  .card-inner p{
    color:#ffe0f0;
    font-size:clamp(17px,4vw,20px);
    line-height:1.55;
    margin:0;
    letter-spacing:0.4px;
    text-shadow:0 1px 6px rgba(255,150,200,0.3);
  }
  .card-hearts{
    font-size:28px;
    margin-top:18px;
    letter-spacing:8px;
    opacity:0.9;
  }

  @media(max-width:420px){
    .timer{gap:10px}
    .tile{padding:16px 12px}
    .clock{width:160px;height:160px}
    .hand.hour{height:45px}
    .hand.minute{height:60px}
    .hand.second{height:70px}
  }
</style>
</head>
<body>
  <div id="bg"></div>
  <canvas id="fireworks"></canvas>

  <div class="container" id="mainContent">
    <div class="clock">
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="center-dot"></div>
    </div>

    <h1>Tany Happy Birthday</h1>

    <div class="timer">
      <div class="tile"><span id="d">--</span><small>DÍAS</small></div>
      <div class="tile"><span id="h">--</span><small>HORAS</small></div>
      <div class="tile"><span id="m">--</span><small>MIN</small></div>
      <div class="tile"><span id="s">--</span><small>SEG</small></div>
    </div>
  </div>

  <!-- Carta final (oculta hasta que el contador llegue a cero) -->
  <div id="finalCard">
    <div class="card-inner">
      <h2>💖 ¡Llegó el momento! 💖</h2>
      <p id="finalMessage">Feliz cumpleaños mi amorcito 😘🎂🥳</p>
      <div class="card-hearts">💕 ✨ 💕</div>
    </div>
  </div>

  <script>
    // Reloj (zona local)
    function uClock(){
      const n = new Date();
      const h = n.getHours() % 12, m = n.getMinutes(), s = n.getSeconds();
      document.getElementById("hour").style.transform = "translate(-50%,-100%) rotate(" + (h*30 + m*0.5) + "deg)";
      document.getElementById("minute").style.transform = "translate(-50%,-100%) rotate(" + (m*6) + "deg)";
      document.getElementById("second").style.transform = "translate(-50%,-100%) rotate(" + (s*6) + "deg)";
    }
    setInterval(uClock, 1000);
    uClock();

    // Contador (zona local)
    let tgt = new Date("2026-10-31T00:00:00");
    let finished = false;

    // 🔁 Si la fecha elegida es hoy, contar hacia mañana
    const nowInit = new Date();
    const todayStr = nowInit.toISOString().split("T")[0];
    if("2026-10-31" === todayStr){
      tgt.setDate(tgt.getDate() + 1);
    }

    function tick(){
      if(finished) return;
      const now = new Date();
      const diff = tgt - now;
      if(isNaN(tgt.getTime())) return;

      const d = Math.max(0, Math.floor(diff / (1000*60*60*24)));
      const h = Math.max(0, Math.floor((diff / (1000*60*60)) % 24));
      const m = Math.max(0, Math.floor((diff / (1000*60)) % 60));
      const s = Math.max(0, Math.floor((diff / 1000) % 60));

      document.getElementById("d").textContent = d;
      document.getElementById("h").textContent = h;
      document.getElementById("m").textContent = m;
      document.getElementById("s").textContent = s;

      // Cuando llega a cero → más fuegos + carta
      if(diff <= 0){
        finished = true;
        document.getElementById("d").textContent = "00";
        document.getElementById("h").textContent = "00";
        document.getElementById("m").textContent = "00";
        document.getElementById("s").textContent = "00";

        // Intensificar fuegos artificiales
        clearInterval(normalBurst);
        for(let i=0; i<8; i++) setTimeout(bigBurst, i * 280);
        setInterval(bigBurst, 450); // más continuo

        // Mostrar la carta después de un momento
        setTimeout(()=>{
          document.getElementById("finalCard").classList.add("show");
        }, 1800);
      }
    }
    setInterval(tick, 1000);
    tick();

    // Fuegos artificiales
    const c = document.getElementById("fireworks");
    const x = c.getContext("2d");
    function rs(){
      c.width = innerWidth;
      c.height = innerHeight;
    }
    rs();
    addEventListener("resize", rs);

    const P = [];
    class Pt{
      constructor(X, Y, C, size){
        this.x = X; this.y = Y; this.c = C;
        this.vx = (Math.random()*7 - 3.5);
        this.vy = (Math.random()*7 - 3.5);
        this.a = 1;
        this.size = size || 2;
      }
      u(){ this.x += this.vx; this.y += this.vy; this.vy += 0.03; this.a -= 0.013; }
      d(){
        x.globalAlpha = this.a;
        x.fillStyle = this.c;
        x.beginPath();
        x.arc(this.x, this.y, this.size, 0, 6.283);
        x.fill();
      }
    }
    function burst(){
      const X = Math.random() * c.width;
      const Y = Math.random() * c.height * 0.5;
      const C = "hsl(" + (Math.random()*360) + ",100%,60%)";
      for(let i=0; i<80; i++) P.push(new Pt(X, Y, C, 2));
    }
    function bigBurst(){
      const X = Math.random() * c.width;
      const Y = Math.random() * c.height * 0.55;
      const C = "hsl(" + (Math.random()*360) + ",100%,65%)";
      for(let i=0; i<160; i++) P.push(new Pt(X, Y, C, 2.4));
    }
    function loop(){
      x.clearRect(0, 0, c.width, c.height);
      for(let i = P.length-1; i>=0; i--){
        const p = P[i];
        p.u();
        p.d();
        if(p.a <= 0) P.splice(i, 1);
      }
      requestAnimationFrame(loop);
    }
    const normalBurst = setInterval(burst, 500);
    burst();
    loop();
  </script>
</body>
</html>
